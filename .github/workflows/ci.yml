name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチへの連続 push では古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # main に既存の lint エラーが 18 件残っているため、今は結果を表示するだけに留める。
    # 既存エラーを解消したらこの行を削除して必須チェックに切り替えること。
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
