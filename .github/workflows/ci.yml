name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチへの連続 push では古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 3 つとも必須。1 つ落ちても残りの結果が分かるよう if: always() で続行する
      # （ジョブを分けないのは npm ci を 1 回で済ませるため）。
      - name: Test
        run: npm run test:run

      # 既存の React Compiler 違反は eslint-suppressions.json に固定済み。
      # 新規違反・件数増加・台帳の未更新はいずれもここで落ちる。
      - name: Lint
        if: always()
        run: npm run lint

      - name: Typecheck
        if: always()
        run: npm run typecheck

  integration:
    name: Database and browser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start local Supabase
        run: supabase start
      - name: Test database policies and RPCs
        run: supabase test db
      - name: Export local app credentials
        shell: bash
        run: |
          supabase status -o env > /tmp/family-task-supabase.env
          source /tmp/family-task-supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test login and household screen
        run: npm run test:e2e
